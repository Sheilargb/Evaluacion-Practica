<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación de Johana</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
      background: #ffe6f0; /* Rosa pastel */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      max-width: 400px;
      padding: 30px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid #ffb6c1; /* Borde rosa */
    }

    h1 {
      font-size: 24px;
      color: #cc2b52;
      margin: 10px 0;
    }

    p {
      font-size: 16px;
      color: #555;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 30px;
      background: #ffb6c1;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #e89ca9;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://i.imgur.com/8Km9tLL.png" alt="Foto de Johana" class="profile-img">
    <h1>Hola, soy Johana 💕</h1>
    <p>
      Soy una chica alegre, creativa y apasionada por el aprendizaje. 
      Me gusta compartir ideas, ayudar a los demás y siempre buscar 
      nuevas formas de crecer. 🌸✨
    </p>
    <a href="#" class="btn">Conóceme más</a>
  </div>
</body>
</html>
