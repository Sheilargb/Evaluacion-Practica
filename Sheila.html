<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Sheila</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            background: #e0f7fa; /* fondo azul pastel claro */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #3e4c59;
        }

        .contenedor {
            background-color: #b3e5fc; /* azul pastel suave */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: #0288d1; /* azul más fuerte para resaltar */
            font-size: 28px;
        }

        p {
            font-size: 20px;
            color: #455a64;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Sheila Yuridia Cruz Badillo</h1>
        <p>de Entornos 3A en la UTXJ</p>
    </div>
</body>
</html>
